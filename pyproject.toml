[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neural_seismic"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "colorcet",
    "PyWavelets",
    "scipy",
    "scikit-learn",
    "tensorflow",
    "keras",
    "dill",
]

[project.optional-dependencies]
notebooks = [
    "jupyter",
    "ipywidgets",
    "imageio",
]

[tool.setuptools.packages.find]
where = ["src"]
